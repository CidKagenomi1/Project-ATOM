<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.T.O.M. Bulletin</title>
    <link rel="stylesheet" href="assets/css/terminal.css">
</head>
<body>
    <div class="terminal-container">
        <h1>[ A.T.O.M. // TERMINAL BULLETIN ] <span class="blink">_</span></h1>
        
        <div id="statusMessage" class="status-message"></div>

        <ul id="newsList" class="news-list">
            <!-- News items will be appended here -->
            <li class="news-item" style="border: none;">[SYSTEM] Initializing secure connection...</li>
        </ul>

        <div id="newsReader" class="news-reader">
            <h2 id="readerTitle"></h2>
            <div id="readerSource" class="source" style="margin-bottom: 20px; color: #aaa;"></div>
            <div id="readerContent" style="line-height: 1.6;"></div>
            <div class="controls">
                <br><br>
                [ESC] Back to List &nbsp;&nbsp; [M] Mark for Dataset
            </div>
        </div>

        <div class="controls" id="listControls">
            [UP/DOWN] Navigate &nbsp;&nbsp; [ENTER] Read &nbsp;&nbsp; [M] Mark for Dataset
        </div>
    </div>

    <script src="assets/js/bulletin.js"></script>
</body>
</html>
