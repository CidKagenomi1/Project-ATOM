<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A.T.O.M. — Autonomous Task Orchestration Machine</title>
  <meta name="description" content="ATOM: AI assistant powered by Gemini & Groq. Smart, fast, and intelligent.">
  <link rel="stylesheet" href="assets/css/main.css?v=4.2">
  <link rel="stylesheet" href="assets/css/components.css?v=4.2">
  <!-- marked.js for markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="app-shell">

    <!-- ============ SIDEBAR ============ -->
    <aside class="app-sidebar" id="app-sidebar">
      <div class="sidebar-header">
        <span class="atom-logo">
          <svg class="svg-logo animated-atom" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="4" fill="currentColor" class="nucleus-glow"/>
            <g class="orbit-group">
              <path class="orbit-line" d="M 50,10 A 15,40 0 1,0 50,90 A 15,40 0 1,0 50,10" fill="none" stroke="currentColor"/>
              <circle r="2" class="electron">
                <animateMotion dur="4s" repeatCount="indefinite" path="M 50,10 A 15,40 0 1,0 50,90 A 15,40 0 1,0 50,10"/>
              </circle>
            </g>
            <g class="orbit-group" transform="rotate(60 50 50)">
              <path class="orbit-line" d="M 50,10 A 15,40 0 1,0 50,90 A 15,40 0 1,0 50,10" fill="none" stroke="currentColor"/>
              <circle r="2" class="electron">
                <animateMotion dur="3.2s" repeatCount="indefinite" path="M 50,10 A 15,40 0 1,0 50,90 A 15,40 0 1,0 50,10"/>
              </circle>
            </g>
            <g class="orbit-group" transform="rotate(120 50 50)">
              <path class="orbit-line" d="M 50,10 A 15,40 0 1,0 50,90 A 15,40 0 1,0 50,10" fill="none" stroke="currentColor"/>
              <circle r="2" class="electron">
                <animateMotion dur="4.8s" repeatCount="indefinite" path="M 50,10 A 15,40 0 1,0 50,90 A 15,40 0 1,0 50,10"/>
              </circle>
            </g>
          </svg>
        </span>
        <div class="atom-brand">
          <div class="atom-brand-title">A.T.O.M.</div>
          <div class="atom-brand-sub">Cortex v4.0</div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a href="index.html" class="active" id="nav-chat">
          <span class="nav-icon">
            <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
          </span>
          Chat
        </a>
        <a href="notes.html" id="nav-notes">
          <span class="nav-icon">
            <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4z"/>
            </svg>
          </span>
          Smart Notes
        </a>
        <a href="telemetry.html" id="nav-telemetry">
          <span class="nav-icon">
            <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
              <line x1="18" y1="20" x2="18" y2="10"/>
              <line x1="12" y1="20" x2="12" y2="4"/>
              <line x1="6" y1="20" x2="6" y2="14"/>
            </svg>
          </span>
          Telemetry
        </a>
      </nav>

      <div class="sidebar-status">
        <div class="status-row">
          <div class="status-dot offline" id="dot-local"></div>
          <span class="status-label">Local AI (Ollama)</span>
        </div>
        <div class="status-row">
          <div class="status-dot offline" id="dot-groq"></div>
          <span class="status-label">Cloud AI (Groq)</span>
        </div>
        <div class="status-row">
          <div class="status-dot offline" id="dot-crew"></div>
          <span class="status-label">Agent CrewAI</span>
        </div>
        <div class="status-row">
          <div class="status-dot offline" id="dot-gemini"></div>
          <span class="status-label">Fallback (Gemini)</span>
        </div>
      </div>
      <div class="sidebar-credit">initiate by alif rahmadi</div>
    </aside>

    <!-- Sidebar overlay (mobile) -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- ============ MAIN CONTENT ============ -->
    <main class="app-main">
      <div class="chat-bg-container">
        <canvas id="vapor-canvas"></canvas>
        <svg class="svg-logo animated-atom bg-logo" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="4" fill="currentColor" class="nucleus-glow"/>
          <g class="orbit-group">
            <path class="orbit-line" d="M 50,10 A 15,40 0 1,0 50,90 A 15,40 0 1,0 50,10" fill="none" stroke="currentColor"/>
            <circle r="2" class="electron">
              <animateMotion dur="4s" repeatCount="indefinite" path="M 50,10 A 15,40 0 1,0 50,90 A 15,40 0 1,0 50,10"/>
            </circle>
          </g>
          <g class="orbit-group" transform="rotate(60 50 50)">
            <path class="orbit-line" d="M 50,10 A 15,40 0 1,0 50,90 A 15,40 0 1,0 50,10" fill="none" stroke="currentColor"/>
            <circle r="2" class="electron">
              <animateMotion dur="3.2s" repeatCount="indefinite" path="M 50,10 A 15,40 0 1,0 50,90 A 15,40 0 1,0 50,10"/>
            </circle>
          </g>
          <g class="orbit-group" transform="rotate(120 50 50)">
            <path class="orbit-line" d="M 50,10 A 15,40 0 1,0 50,90 A 15,40 0 1,0 50,10" fill="none" stroke="currentColor"/>
            <circle r="2" class="electron">
              <animateMotion dur="4.8s" repeatCount="indefinite" path="M 50,10 A 15,40 0 1,0 50,90 A 15,40 0 1,0 50,10"/>
            </circle>
          </g>
        </svg>
      </div>

      <!-- Topbar -->
      <header class="app-topbar">
        <div class="flex items-center gap-3">
          <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Open menu">☰</button>
          <span class="topbar-title">Chat</span>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-ghost btn-sm" id="btn-clear-chat" title="Clear chat">
            🗑️ Clear
          </button>
        </div>
      </header>

      <!-- Chat Layout -->
      <div class="chat-layout">

        <!-- Messages -->
        <div class="messages-area" id="messages-area">

          <!-- Grand Header -->
          <div class="atom-header">
            <h1 class="atom-title">A.T.O.M.</h1>
            <p class="atom-subtitle">Autonomous Task Orchestration Machine · v4.0 Cortex</p>
            <div class="atom-status-row" id="status-pills">
              <span class="status-pill offline" id="pill-local">
                <span>●</span> Local AI
              </span>
              <span class="status-pill offline" id="pill-groq">
                <span>●</span> Cloud AI
              </span>
              <span class="status-pill offline" id="pill-crew">
                <span>●</span> CrewAI
              </span>
              <span class="status-pill offline" id="pill-gemini">
                <span>●</span> Fallback
              </span>
            </div>
          </div>

          <!-- Empty state (shown when no messages) -->
          <div class="empty-chat" id="empty-chat">
            <div class="icon">
              <svg class="svg-logo animated-atom" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="4" fill="currentColor" class="nucleus-glow"/>
                <g class="orbit-group">
                  <path class="orbit-line" d="M 50,10 A 15,40 0 1,0 50,90 A 15,40 0 1,0 50,10" fill="none" stroke="currentColor"/>
                  <circle r="2" class="electron">
                    <animateMotion dur="4s" repeatCount="indefinite" path="M 50,10 A 15,40 0 1,0 50,90 A 15,40 0 1,0 50,10"/>
                  </circle>
                </g>
                <g class="orbit-group" transform="rotate(60 50 50)">
                  <path class="orbit-line" d="M 50,10 A 15,40 0 1,0 50,90 A 15,40 0 1,0 50,10" fill="none" stroke="currentColor"/>
                  <circle r="2" class="electron">
                    <animateMotion dur="3.2s" repeatCount="indefinite" path="M 50,10 A 15,40 0 1,0 50,90 A 15,40 0 1,0 50,10"/>
                  </circle>
                </g>
                <g class="orbit-group" transform="rotate(120 50 50)">
                  <path class="orbit-line" d="M 50,10 A 15,40 0 1,0 50,90 A 15,40 0 1,0 50,10" fill="none" stroke="currentColor"/>
                  <circle r="2" class="electron">
                    <animateMotion dur="4.8s" repeatCount="indefinite" path="M 50,10 A 15,40 0 1,0 50,90 A 15,40 0 1,0 50,10"/>
                  </circle>
                </g>
              </svg>
            </div>
            <p>ATOM siap. Tanyakan apa saja.</p>
            <div class="suggestions">
              <button class="suggestion-chip" data-suggestion="Jelaskan konsep machine learning dalam bahasa sederhana">
                💡 Jelaskan machine learning
              </button>
              <button class="suggestion-chip" data-suggestion="Bantu saya menulis kode Python untuk scraping web">
                🐍 Python web scraping
              </button>
              <button class="suggestion-chip" data-suggestion="Buatkan saya jadwal belajar pemrograman 30 hari">
                📅 Jadwal belajar 30 hari
              </button>
              <button class="suggestion-chip" data-suggestion="Apa perbedaan antara AI, ML, dan Deep Learning?">
                🧠 AI vs ML vs Deep Learning
              </button>
            </div>
          </div>

        </div>

        <!-- Input Area -->
        <div class="input-area">
          <div class="model-select-wrapper">
            <select class="model-select" id="model-select" aria-label="Pilih Model AI">
              <option value="auto">🤖 Auto (Cortex Route)</option>
              <option value="groq">⚡ Groq (Llama 3.3 70B)</option>
              <option value="ollama">🧠 Ollama (DeepSeek V4 Cloud)</option>
              <option value="openrouter">🌐 OpenRouter (Fallback List)</option>
              <option value="openrouter:openai/gpt-oss-120b:free">🧩 OR: GPT OSS 120B (Free)</option>
              <option value="openrouter:z-ai/glm-4.5-air:free">🧩 OR: GLM 4.5 Air (Free)</option>
              <option value="openrouter:poolside/laguna-m.1:free">🧩 OR: Laguna M.1 (Free)</option>
              <option value="openrouter:nvidia/nemotron-3-super-120b-a12b:free">🧩 OR: Nemotron-3 Super (Free)</option>
              <option value="deepseek">🐳 DeepSeek (V3)</option>
              <option value="gemini">♊ Gemini (Flash 2.5)</option>
            </select>
          </div>
          <div class="input-row" id="input-row">
            <div class="input-main-wrapper" style="display: flex; flex-direction: column; flex: 1; width: 100%;">
              <!-- Attached Files Display inside the input area box -->
              <div class="attached-files" id="attached-files"></div>
              <textarea
                class="chat-input"
                id="chat-input"
                placeholder="Ask A.T.O.M. anything..."
                rows="1"
                aria-label="Chat message input"
              ></textarea>
            </div>
            <div class="input-actions">
              <button class="btn-attach" id="btn-attach" title="Attach file">
                📎
              </button>
              <button class="btn-send" id="btn-send" title="Send message" disabled>
                ➤
              </button>
            </div>
          </div>
          <!-- Hidden file input -->
          <input
            type="file"
            id="file-upload"
            accept=".txt,.md,.py,.json,.csv,.html,.css,.js"
            multiple
          >
        </div>

      </div><!-- /chat-layout -->
    </main>
  </div>



  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <script src="assets/js/particles.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/chat.js"></script>
  <script src="assets/js/mobile-ui.js"></script>
</body>
</html>
